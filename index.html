<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harness · Portal</title>
  <style>
    :root {
      --bg: #0b0f17;
      --card: #131a26;
      --border: #232e42;
      --text: #e6edf6;
      --muted: #8b9bb4;
      --accent: #34d399;
      --accent-hover: #10b981;
      --secondary: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top, #172033 0%, var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.28);
      border-radius: 999px;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 10px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.btn {
      display: block;
      padding: 13px 18px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    a.btn:hover { transform: translateY(-1px); }
    a.btn-primary {
      background: var(--accent);
      color: #06281c;
    }
    a.btn-primary:hover { background: var(--accent-hover); }
    a.btn-secondary {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--border);
    }
    a.btn-secondary:hover { background: #273549; }
    .foot {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">harness.loc.cc</span>
    <h1>Harness · 个人入口</h1>
    <p>个人项目与 GitHub 星标知识库导航</p>
    <div class="actions">
      <a class="btn btn-primary" href="http://stars.harness.loc.cc:8080">GitHub Stars 管理看板</a>
      <a class="btn btn-secondary" href="https://github.com/luckiestultra" target="_blank" rel="noopener noreferrer">GitHub 主页</a>
    </div>
    <div class="foot">Powered by GitHub Pages</div>
  </main>
</body>
</html>
